name: CI
on: [push, pull_request]

jobs:
  kit-linux:
    name: SupportCareKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path SupportCareKit

  app-ios:
    name: iOS app build & test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cp Config/Config.example.xcconfig Config/Config.xcconfig
      - run: xcodegen generate
      - name: Build & test
        run: |
          xcodebuild -project SupportCare.xcodeproj -scheme SupportCare \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO test | xcbeautify || exit ${PIPESTATUS[0]}
